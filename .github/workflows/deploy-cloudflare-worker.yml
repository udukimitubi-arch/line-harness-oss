name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'apps/liff/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/line-sdk/**'
      - 'packages/update-engine/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'

jobs:
  deploy:
    if: github.repository != 'Shudesu/line-harness-oss' && vars.LINE_HARNESS_CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db --filter @line-harness/update-engine build

      - name: Run pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$D1_DATABASE_NAME"

          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command \
            "CREATE TABLE IF NOT EXISTS _migrations (name TEXT PRIMARY KEY, applied_at TEXT NOT NULL)"

          # Print the first column of every row returned by a query.
          list() {
            npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command "$1" --json \
              | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));for(const r of d[0]?.results??[])console.log(Object.values(r)[0])"
          }

          list "SELECT name FROM _migrations" > applied.txt
          tables="$(list "SELECT name FROM sqlite_master WHERE type='table'")"

          # Installs made with create-line-harness record applied migrations in
          # _line_harness_migrations, not _migrations. Count those as applied so
          # the first deploy from a fork does not replay every migration.
          : > legacy.txt
          if grep -qx '_line_harness_migrations' <<<"$tables"; then
            list "SELECT name FROM _line_harness_migrations" > legacy.txt
          fi

          : > pending.txt
          for f in $(ls packages/db/migrations/*.sql | sort); do
            name=$(basename "$f")
            if ! grep -qxF "$name" applied.txt && ! grep -qxF "$name" legacy.txt; then
              echo "$name" >> pending.txt
            fi
          done

          # Migrations before 041 include table rebuilds (027/029) that are not
          # safe to re-run. On a database that is already in use, needing one of
          # them means the ledgers are out of sync, so stop before touching data.
          if grep -qx 'friends' <<<"$tables" && grep -q '^0[0-3][0-9]_\|^040_' pending.txt; then
            echo "::error::Live database would replay pre-041 migrations:"
            cat pending.txt
            exit 1
          fi

          for f in $(ls packages/db/migrations/*.sql | sort); do
            name=$(basename "$f")
            if grep -qxF "$name" applied.txt; then
              echo "Skipped: $name"
            elif grep -qxF "$name" legacy.txt; then
              echo "Recorded (applied by create-line-harness): $name"
              npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command \
                "INSERT OR IGNORE INTO _migrations (name, applied_at) VALUES ('${name}', datetime('now'))"
            else
              echo "Applying: $name"
              npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --file="$f"
              npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command \
                "INSERT INTO _migrations (name, applied_at) VALUES ('${name}', datetime('now'))"
            fi
          done

      - name: Build Worker and LIFF assets
        run: pnpm --filter worker build
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}

      - name: Patch wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME || 'your-worker-name' }}
          # Admin CORS config — set these as repo Variables when the admin panel
          # and the Worker API are on different origins (e.g. *.pages.dev admin
          # + *.workers.dev API). Baking them into the deployed config (vars)
          # means every deploy carries them, so they can't be silently dropped
          # the way a manually-set dashboard variable is on redeploy.
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
          ADMIN_ALLOW_CROSS_SITE: ${{ vars.ADMIN_ALLOW_CROSS_SITE }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          # Set to "false" to stop salon booking reminders (day_before /
          # hours_before). Unset keeps the upstream default (on).
          BOOKING_REMINDERS_ENABLED: ${{ vars.BOOKING_REMINDERS_ENABLED }}
          # Real public URLs of this deployment. Without them the deployed
          # config carries the placeholder values from wrangler.toml [vars].
          WORKER_PUBLIC_URL: ${{ vars.WORKER_PUBLIC_URL }}
          ADMIN_PUBLIC_URL: ${{ vars.ADMIN_PUBLIC_URL }}
          ADMIN_PAGES_PROJECT: ${{ vars.ADMIN_PAGES_PROJECT }}
        run: |
          test -n "$D1_DATABASE_ID"
          cd apps/worker
          sed -i \
            -e "s|\"account_id\":\"[^\"]*\"|\"account_id\":\"${CLOUDFLARE_ACCOUNT_ID}\"|g" \
            -e "s|\"database_name\":\"[^\"]*\"|\"database_name\":\"${D1_DATABASE_NAME}\"|g" \
            -e "s|\"database_id\":\"[^\"]*\"|\"database_id\":\"${D1_DATABASE_ID}\"|g" \
            dist/line_harness/wrangler.json
          # Inject admin CORS vars into the deployed config when ADMIN_ORIGIN is
          # set. ADMIN_ALLOW_CROSS_SITE defaults to "true" (SameSite=None; Secure
          # cookies) since cross-origin admin/API is the case that needs it.
          if [ -n "$ADMIN_ORIGIN" ]; then
            tmp="$(mktemp)"
            jq --arg o "$ADMIN_ORIGIN" --arg x "$ADMIN_ALLOW_CROSS_SITE" --arg w "$WORKER_URL" '
              .vars.ADMIN_ORIGIN = $o
              | .vars.ADMIN_ALLOW_CROSS_SITE = (if $x == "" then "true" else $x end)
              | (if $w != "" then .vars.WORKER_URL = $w else . end)
            ' dist/line_harness/wrangler.json > "$tmp" && mv "$tmp" dist/line_harness/wrangler.json
            echo "Patched admin CORS vars: ADMIN_ORIGIN=$ADMIN_ORIGIN ADMIN_ALLOW_CROSS_SITE=${ADMIN_ALLOW_CROSS_SITE:-true}"
          fi
          if [ -n "$BOOKING_REMINDERS_ENABLED" ]; then
            tmp="$(mktemp)"
            jq --arg v "$BOOKING_REMINDERS_ENABLED" '.vars.BOOKING_REMINDERS_ENABLED = $v' \
              dist/line_harness/wrangler.json > "$tmp" && mv "$tmp" dist/line_harness/wrangler.json
            echo "Patched BOOKING_REMINDERS_ENABLED=$BOOKING_REMINDERS_ENABLED"
          fi
          tmp="$(mktemp)"
          jq --arg acct "$CLOUDFLARE_ACCOUNT_ID" --arg d1 "$D1_DATABASE_ID" \
             --arg w "$WORKER_PUBLIC_URL" --arg a "$ADMIN_PUBLIC_URL" --arg ap "$ADMIN_PAGES_PROJECT" '
            .vars.CF_ACCOUNT_ID = $acct
            | .vars.D1_DATABASE_ID = $d1
            | (if $w != "" then .vars.WORKER_PUBLIC_URL = $w else . end)
            | (if $a != "" then .vars.ADMIN_PUBLIC_URL = $a else . end)
            | (if $ap != "" then .vars.ADMIN_PAGES_PROJECT = $ap else . end)
            # wrangler.toml enables the Workers Cache pilot only for the test
            # Worker and turns it off for production; match production here.
            | .cache = {"enabled": false}
          ' dist/line_harness/wrangler.json > "$tmp" && mv "$tmp" dist/line_harness/wrangler.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --config dist/line_harness/wrangler.json --name ${{ vars.WORKER_NAME || 'your-worker-name' }}
